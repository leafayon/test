name: Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.7
      - run: crystal build test.cr -o Test --release
      - name: Create binary
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.7
      - run: crystal build test.cr -o Test --release
      - name: Create binary
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./Test.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
